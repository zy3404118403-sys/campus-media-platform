<button class="btn" type="button" style="padding:4px 12px;font-size:13px" onclick="addPollOption()">+ 添加选项</button></div>
<div class="form-group"><label><input type="checkbox" id="poll-multiple"> 允许多选</label></div>
</div>
</div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeModal('thread-modal')">取消</button><button class="btn btn-primary" onclick="submitThread()">发布</button></div>
</div>
</div>

<!-- 墙贴弹窗 -->
<div class="modal-overlay" id="wall-modal">
<div class="modal">
<h2>发墙贴</h2>
<div class="form-group"><label for="wall-content">内容（200字以内）</label><textarea class="form-textarea" id="wall-content" maxlength="200" style="min-height:100px" placeholder="说点什么..."></textarea></div>
<div class="form-group"><label for="wall-tag">标签</label><select class="form-select" id="wall-tag"><option value="分享">分享</option><option value="表白">表白</option><option value="求助">求助</option><option value="吐槽">吐槽</option><option value="问答">问答</option></select></div>
<div class="form-group"><label><input type="checkbox" id="wall-anon"> 匿名发布</label></div>
<div class="form-group">
<label>图片（可选，最多3张）</label>
<div class="image-upload-area">
<input type="file" id="wall-image-input" accept="image/*" multiple style="display:none" onchange="handleWallImages(this)">
<div class="image-upload-btn" onclick="$('wall-image-input').click()"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> 添加图片</div>
<div class="image-preview-row" id="wall-image-previews"></div>
</div>
</div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeModal('wall-modal')">取消</button><button class="btn btn-primary" onclick="submitWall()">发布</button></div>
</div>
</div>

<!-- 墙贴详情弹窗 -->
<div class="modal-overlay" id="wall-detail-modal" role="dialog" aria-modal="true" aria-label="墙贴详情" onclick="if(event.target===this)closeWallDetail()">
<div class="modal">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
<h2 style="margin:0">墙贴详情</h2>
<div style="display:flex;gap:8px">
<button class="btn btn-sm" onclick="likeWallPost()" aria-label="点赞"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 点赞</button>
<button class="btn btn-outline btn-sm" onclick="closeWallDetail()" aria-label="关闭">关闭</button>
</div>
</div>
<div id="wd-content" class="form-textarea" style="min-height:60px;border:none;padding:0;white-space:pre-wrap;background:transparent;resize:none"></div>
<div id="wd-images" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px"></div>
<div id="wd-meta" style="margin-top:14px;font-size:12.5px;color:var(--text-3,#8a93a5);display:flex;align-items:center;gap:8px;flex-wrap:wrap"></div>
<div style="border-top:1px solid var(--border,rgba(128,128,128,.15));margin-top:16px;padding-top:14px">
<h3 style="margin:0 0 10px;font-size:14px">评论</h3>
<div id="wd-comments" style="max-height:220px;overflow:auto"></div>
<div style="display:flex;gap:8px;margin-top:12px;align-items:flex-start">
<input type="text" class="form-input" id="wd-comment-input" maxlength="200" placeholder="说点什么...（200字以内）" style="flex:1" onkeydown="if(event.key==='Enter')postWallComment()">
<label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;color:var(--text-3,#8a93a5)"><input type="checkbox" id="wd-anon"> 匿名</label>
<button class="btn btn-primary btn-sm" onclick="postWallComment()">发布</button>
</div>
</div>
</div>
</div>

<!-- 评论弹窗 -->
<div class="modal-overlay" id="comment-modal">
<div class="modal comment-modal">
<h2>发表评论</h2>
<div class="form-group"><label for="comment-content">评论内容</label><textarea class="form-textarea" id="comment-content" placeholder="写下你的评论..." maxlength="500"></textarea></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeModal('comment-modal')">取消</button><button class="btn btn-primary" onclick="submitComment()">发送评论</button></div>
</div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="edit-modal">
<div class="modal">
<h2 id="edit-modal-title">编辑</h2>
<div class="form-group"><label for="edit-title">标题</label><input class="form-input" id="edit-title" placeholder="请输入标题"></div>
<div class="form-group" id="edit-category-wrap" style="display:none"><label for="edit-category">分类</label><select class="form-select" id="edit-category"><option value="campus">校园</option><option value="tech">技术</option><option value="life">生活</option><option value="study">学习</option></select></div>
<div class="form-group" id="edit-content-rte-wrap"><label>正文</label>
<div style="border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">
<div class="rte-toolbar">
<button class="rte-btn" type="button" onclick="rteCmd('bold')" title="粗体" aria-label="粗体"><b>B</b></button>
<button class="rte-btn" type="button" onclick="rteCmd('italic')" title="斜体" aria-label="斜体"><i>I</i></button>
<button class="rte-btn" type="button" onclick="rteCmd('underline')" title="下划线" aria-label="下划线"><u>U</u></button>
<button class="rte-btn" type="button" onclick="rteCmd('insertUnorderedList')" title="列表" aria-label="无序列表">•</button>
<button class="rte-btn" type="button" onclick="rteCmd('insertOrderedList')" title="编号" aria-label="有序列表">1.</button>
<button class="rte-btn" type="button" onclick="rteCmd('formatBlock','blockquote')" title="引用" aria-label="引用"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-hidden="true"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .5-1 1v1c0 1 .5 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h1v1c0 1-1 2-1.5 2s-1.5.5-1.5 1v1c0 1 .5 1 1 1z"/></svg></button>
<button class="rte-btn" type="button" onclick="rteLink()" title="链接" aria-label="插入链接"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
<button class="rte-btn" type="button" onclick="insertBlogImage()" title="插入图片" aria-label="插入图片"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
<button class="rte-btn" type="button" onclick="rteCmd('formatBlock','pre')" title="代码" aria-label="代码块">&lt;/&gt;</button>
</div>
<div class="rte-editor" id="edit-content" contenteditable="true" role="textbox" aria-label="编辑正文" data-placeholder="请输入内容..." style="min-height:120px" onfocus="activeEditor='edit-content'"></div>
</div>
</div>
<div class="form-group" id="edit-content-text-wrap" style="display:none"><label for="edit-content-text">内容（200字以内）</label><textarea class="form-textarea" id="edit-content-text" maxlength="200" style="min-height:100px" placeholder="说点什么..."></textarea></div>
<div class="form-group" id="edit-tag-wrap" style="display:none"><label for="edit-tag">标签</label><select class="form-select" id="edit-tag"><option value="分享">分享</option><option value="表白">表白</option><option value="求助">求助</option><option value="吐槽">吐槽</option><option value="问答">问答</option></select></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeModal('edit-modal')">取消</button><button class="btn btn-primary" onclick="submitEdit()">保存</button></div>
</div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirm-modal">
<div class="modal" style="max-width:400px">
<h2 id="confirm-title">确认</h2>
<p id="confirm-message" style="margin:12px 0;color:var(--text-2)"></p>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="closeModal('confirm-modal')">取消</button><button class="btn btn-primary" id="confirm-ok-btn" style="background:#ef4444">确认删除</button></div>
</div>
</div>

<script src="shared.js?v=20"></script>
<script src="/assets/community.js?v=p2v10"></script>
<button id="themeToggle" onclick="toggleTheme()" title="切换主题" aria-label="切换主题" aria-pressed="false">
  <span id="themeToggleIcon"></span>
</button>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw').catch(function (e) { console.warn('SW registration failed:', e) })
    })
  }
</script>
<script>
// 低危修复：管理入口仅对管理员可见（避免未登录用户看到后台路径）
fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.json() }).then(function (d) {
  if (d && d.ok && d.user && d.user.is_admin) {
    var el = document.getElementById('footer-admin-link')
    if (el) el.style.display = ''
  }
}).catch(function () {})
</script>
