<title>融媒体文稿工作台 · 校园融媒工坊</title>
<style>
:root{
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-light:#60a5fa;--primary-glow:rgba(59,130,246,.35);
  --accent:#06b6d4;--aurora:#8b5cf6;
  --gold:#d4af37;--gold-light:#f0d060;
  --bg:#05070B;--bg-warm:#0f0a0e;
  --card:rgba(255,255,255,.03);--card-hover:rgba(255,255,255,.06);--bg-elevated:rgba(255,255,255,.06);
  --text:#e8eaed;--text-2:#9aa0b0;--text-3:#868c99;
  --border:rgba(255,255,255,.06);--border-strong:rgba(255,255,255,.1);
  --radius:16px;--radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,.4);--shadow-md:0 8px 40px rgba(0,0,0,.5);
  --sidebar-w:230px;
  --glass:rgba(255,255,255,.04);
}
[data-theme="light"]{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#3b82f6;--primary-glow:rgba(37,99,235,.2);
  --accent:#0891b2;--aurora:#7c3aed;
  --gold:#b8860b;--gold-light:#daa520;
  --bg:#f4f5f8;--bg-warm:#e8e9ed;
  --card:rgba(0,0,0,.025);--card-hover:rgba(0,0,0,.05);--bg-elevated:rgba(0,0,0,.04);
  --text:#1a1a2e;--text-2:#4a5060;--text-3:#5f6570;
  --border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.12);
  --shadow:0 4px 24px rgba(0,0,0,.08);--shadow-md:0 8px 40px rgba(0,0,0,.12);
  --glass:rgba(255,255,255,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 70% 0%,rgba(59,130,246,.06) 0%,transparent 50%),radial-gradient(ellipse at 30% 100%,rgba(139,92,246,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
[data-theme="light"] body{background:var(--bg);color:var(--text)}
[data-theme="light"] body::before{background:radial-gradient(ellipse at 70% 0%,rgba(59,130,246,.06) 0%,transparent 50%),radial-gradient(ellipse at 30% 100%,rgba(212,175,55,.05) 0%,transparent 50%)}

/* ── 布局 ── */
.app{display:flex;min-height:100vh;min-height:100dvh;position:relative;z-index:1}
.sidebar{width:var(--sidebar-w);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;padding:20px 0}
[data-theme="light"] .sidebar{background:rgba(255,255,255,.7)}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--border)}
.sidebar-brand .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--aurora));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.sidebar-brand .name{font-size:15px;font-weight:700;color:var(--text)}
.sidebar-brand .sub{font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 12px;scrollbar-width:none;-ms-overflow-style:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-group{margin-bottom:16px}
.nav-group-title{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;padding:0 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;transition:all .15s;text-decoration:none;margin-bottom:2px;min-height:40px}
.nav-item:hover{background:var(--card-hover);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--primary)}
[data-theme="light"] .nav-item.active{background:rgba(37,99,235,.1);color:var(--primary)}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:rgba(245,158,11,.2);color:#f59e0b;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:var(--card);color:var(--text-2);border:1px solid var(--border)}
.btn-outline:hover{background:var(--card-hover);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-dark{background:var(--card);color:var(--text-2);border:1px solid var(--border)}
.btn-dark:hover{background:var(--card-hover)}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);min-height:56px}
[data-theme="light"] .topbar{background:rgba(255,255,255,.8)}
.page-title{font-size:17px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:20px;background:var(--card);border:1px solid var(--border)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--aurora));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.user-name{font-size:13px;color:var(--text-2)}
.content{padding:24px;max-width:1200px}

/* ── 文稿列表 ── */
.article-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.article-card .article-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.article-card .article-actions .btn{padding:4px 10px;font-size:12px}

/* ── 编辑器视图 ── */
.editor-view{display:none}
.editor-view.active{display:block}
.list-view.hidden{display:none}
.editor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.editor-title-input{width:100%;font-size:22px;font-weight:700;color:var(--text);background:transparent;border:none;outline:none;padding:8px 0;border-bottom:2px solid transparent;transition:border-color .2s;font-family:inherit}
.editor-title-input:focus{border-bottom-color:var(--primary)}
.editor-title-input::placeholder{color:var(--text-3)}
.editor-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0}
.editor-meta .meta-field{display:flex;flex-direction:column;gap:4px}
.editor-meta label{font-size:12px;font-weight:600;color:var(--text-3)}
.editor-meta input,.editor-meta select{padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.editor-meta input:focus,.editor-meta select:focus{border-color:var(--primary)}
.editor-body{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:8px}
.editor-footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:16px 0;border-top:1px solid var(--border)}
.sensitive-result{margin-top:12px;padding:12px;border-radius:8px;font-size:13px;display:none}
.sensitive-result.show{display:block}
.sensitive-result.has-hits{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2)}
.sensitive-result.clean{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2)}
.sensitive-result h4{font-size:13px;margin-bottom:6px}
.sensitive-hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ── 详情视图 ── */
.detail-view{display:none}
.detail-view.active{display:block}
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.detail-title{font-size:24px;font-weight:700;color:var(--text);line-height:1.3}
.detail-meta{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:13px;color:var(--text-3)}
.detail-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;font-size:15px;line-height:1.8;color:var(--text);min-height:200px}
.detail-content h1{font-size:1.5em;font-weight:700;margin:.6em 0 .3em}
.detail-content h2{font-size:1.3em;font-weight:600;margin:.6em 0 .3em}
.detail-content h3{font-size:1.15em;font-weight:600;margin:.5em 0 .25em}
.detail-content p{margin:.5em 0}
.detail-content ul,.detail-content ol{margin:.5em 0;padding-left:1.8em}
.detail-content blockquote{border-left:3px solid var(--primary);padding-left:14px;margin:.6em 0;color:var(--text-2);font-style:italic}
.detail-content img{max-width:100%;border-radius:8px;margin:.5em 0}
.detail-content a{color:var(--primary);text-decoration:underline}
.detail-content code{background:var(--bg-elevated);padding:2px 6px;border-radius:4px;font-size:.9em;font-family:monospace}
.detail-section{margin-top:24px}
.detail-section h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px}

/* ── 模态框 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg-warm);border:1px solid var(--border-strong);border-radius:16px;padding:28px;max-width:500px;width:100%;box-shadow:var(--shadow-md);animation:modalIn .3s ease}
[data-theme="light"] .modal-box{background:#fff}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal-body{margin-bottom:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px}
.modal-input{width:100%;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:8px}
.modal-input:focus{border-color:var(--primary)}
.modal-textarea{width:100%;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;font-family:inherit;outline:none;min-height:80px;resize:vertical}

/* ── 响应式 ── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .editor-meta{grid-template-columns:1fr}
  .content{padding:16px}
  .article-grid{grid-template-columns:1fr}
  .menu-toggle{display:flex !important}
}
.menu-toggle{display:none;width:40px;height:40px;border-radius:8px;background:var(--card);border:1px solid var(--border);align-items:center;justify-content:center;cursor:pointer;color:var(--text)}

.hidden{display:none !important}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);background:rgba(138,8,22,.92);color:#fff;padding:13px 30px;border-radius:14px;font-size:14px;z-index:300;opacity:0;transition:all .4s;pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="light"] .toast{background:var(--bg-warm);color:var(--text);border:1px solid var(--border)}
#themeToggle{position:fixed;bottom:24px;right:24px;z-index:9998;width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .3s;box-shadow:var(--shadow)}
#themeToggle:hover{transform:scale(1.1)}
</style>

<body>

<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">CS</div>
      <div><div class="name">校园融媒工坊</div><div class="sub">文稿工作台</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group">
        <div class="nav-group-title">文稿</div>
        <a class="nav-item active" onclick="showListView()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>我的文稿</span>
          <span class="badge" id="draftBadge" style="display:none">0</span>
        </a>
        <a class="nav-item" onclick="showEditorView()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>新建文稿</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">导航</div>
        <a class="nav-item" href="/">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>返回首页</span>
        </a>
        <a class="nav-item" href="/admin.html" id="adminLink" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>管理后台</span>
        </a>
        <a class="nav-item" href="/user.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>个人中心</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-dark" onclick="doLogout()" style="width:100%;border-radius:8px">退出登录</button>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title" id="pageTitle">我的文稿</div>
      </div>
      <div class="topbar-right">
        <a href="/admin.html" id="backToAdmin" class="btn btn-outline btn-sm" style="display:none;gap:6px;align-items:center;text-decoration:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          返回管理后台
        </a>
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">?</div>
          <span class="user-name" id="userName">加载中...</span>
        </div>
      </div>
    </header>

    <div class="sub-nav" id="subNav" style="display:none">
      <div class="sub-nav-item active" data-subtab="articles" onclick="switchSubTab('articles')">我的文稿</div>
      <div class="sub-nav-item" data-subtab="review" onclick="switchSubTab('review')">文稿审核</div>
      <div class="sub-nav-item" data-subtab="sensitive" onclick="switchSubTab('sensitive')">敏感词库</div>
    </div>

    <div class="content">
      <!-- ── 列表视图 ── -->
      <div id="listView" class="list-view">
        <div class="article-filters">
          <div class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部</div>
          <div class="filter-chip" data-filter="draft" onclick="setFilter('draft')">草稿</div>
          <div class="filter-chip" data-filter="pending" onclick="setFilter('pending')">审核中</div>
          <div class="filter-chip" data-filter="published_ready" onclick="setFilter('published_ready')">待发布</div>
          <div class="filter-chip" data-filter="published" onclick="setFilter('published')">已发布</div>
          <div class="filter-chip" data-filter="rejected" onclick="setFilter('rejected')">已拒绝</div>
          <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="showEditorView()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新建文稿
          </button>
        </div>
        <div class="article-grid" id="articleGrid">
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
        </div>
      </div>

      <!-- ── 编辑器视图 ── -->
      <div id="editorView" class="editor-view">
        <div class="editor-header">
          <button class="btn btn-outline btn-sm" onclick="showListView()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            返回列表
          </button>
          <div id="editorMode" style="font-size:13px;color:var(--text-3)">新建文稿</div>
        </div>
        <input type="text" class="editor-title-input" id="articleTitle" placeholder="输入文稿标题..." maxlength="200">
        <div class="editor-meta">
          <div class="meta-field">
            <label>分类</label>
            <select id="articleCategory">
              <option value="news">校园新闻</option>
              <option value="notice">通知公告</option>
              <option value="feature">专题报道</option>
              <option value="activity">活动宣传</option>
              <option value="culture">文化生活</option>
              <option value="academic">学术科研</option>
            </select>
          </div>
          <div class="meta-field">
            <label>审核级别</label>
            <select id="articleReviewLevel">
              <option value="1">一级审核（快速发布）</option>
              <option value="2">二级审核（部门审核）</option>
              <option value="3">三级审核（三审三校）</option>
            </select>
          </div>
          <div class="meta-field">
            <label>封面图URL</label>
            <input type="text" id="articleCover" placeholder="可选，输入图片URL">
          </div>
        </div>

            <button class="rte-btn" onclick="insertLink()" title="插入链接"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
            <button class="rte-btn" onclick="insertImage()" title="插入图片"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>

            敏感词检测

          <span id="autosaveStatus" style="font-size:12px;color:var(--text-3,#8a93a5)"></span>

            <button class="btn btn-outline" onclick="saveDraft()">保存草稿</button>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            返回列表

        <h1 class="detail-title" id="detailTitle"></h1>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-section">
          <h3>正文内容</h3>
          <div class="detail-content" id="detailContent"></div>
        </div>
        <div class="detail-section" id="detailReviewSection" style="display:none">
          <h3>审核记录</h3>

      <!-- ── 文稿审核视图 ── -->
      <div id="reviewView" class="list-view" style="display:none">
        <div class="article-filters">
          <div class="filter-chip active" data-review-filter="pending_l1" onclick="setReviewFilter('pending_l1')">一审待审</div>
          <div class="filter-chip" data-review-filter="pending_l2" onclick="setReviewFilter('pending_l2')">二审待审</div>

          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
          <div class="sk-card"><div class="skeleton sk-thumb"></div><div class="sk-pad"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>

      <!-- ── 敏感词库视图 ── -->
      <div id="sensitiveView" style="display:none">
        <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
          <input type="text" id="newSensitiveWord" placeholder="输入敏感词" style="flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px">
          <select id="newSensitiveLevel" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px">
            <option value="high">高级（禁止发布）</option>
            <option value="medium" selected>中级（警告提示）</option>
            <option value="low">低级（记录备案）</option>
          </select>
          <select id="newSensitiveCategory" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px">
            <option value="政治">政治</option>
            <option value="色情">色情</option>
            <option value="暴力">暴力</option>

      <div style="margin-bottom:12px;font-size:13px;color:var(--text-2)">选择推送目标平台：</div>
      <div id="publishTargets" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

      <button class="btn btn-primary" onclick="doPublish()">确认发布</button>

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>
<button id="themeToggle" onclick="toggleTheme()" aria-label="切换主题">
  <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>

<script src="shared.js?v=20"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   文稿工作台 · 核心逻辑
   ═══════════════════════════════════════════════════════════════ */

var currentUser = null
var currentFilter = 'all'
var editingArticleId = null
var currentArticleDetail = null
var pendingReviewAction = null

var STATUS_MAP = {
  'draft': {text:'草稿', cls:'draft'},
  'pending_l1': {text:'一审中', cls:'pending_l1'},
  'pending_l2': {text:'二审中', cls:'pending_l2'},
  'pending_l3': {text:'三审中', cls:'pending_l3'},
  'published_ready': {text:'待发布', cls:'published_ready'},
  'published': {text:'已发布', cls:'published'},
  'rejected': {text:'已拒绝', cls:'rejected'},
}

var STAGE_MAP = {
  'submit': {text:'提交审核', icon:'<svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>', cls:'submit'},
  'first_review': {text:'初审', icon:'<svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>', cls:'first_review'},
  'second_review': {text:'复审', icon:'<svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>', cls:'second_review'},
  'third_review': {text:'终审', icon:'<svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>️', cls:'third_review'},
  'approve': {text:'通过', icon:'✓', cls:'approve'},
  'reject': {text:'拒绝', icon:'✗', cls:'reject'},
  'return': {text:'退回', icon:'↩', cls:'return'},
}

var CATEGORY_MAP = {
  'news':'校园新闻','notice':'通知公告','feature':'专题报道',
  'activity':'活动宣传','culture':'文化生活','academic':'学术科研',
}

var PLATFORM_MAP = {
  'website':'官方网站','wechat':'微信公众号','weibo':'微博',
  'douyin':'抖音','bilibili':'B站','xhs':'小红书',
}

/* ── 初始化 ── */
async function init(){
  await loadCurrentUser()
  await loadArticles()
  updateThemeIcon()
}

async function loadCurrentUser(){
  var res = await api('/api/me')
  if(!res || !res.ok || !res.user){
    location.href = '/login.html?redirect=' + encodeURIComponent('/articles.html')
    return
  }
  currentUser = res.user
  $('userName').textContent = currentUser.name
  $('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase()
  if(currentUser.is_admin){
    $('adminLink').style.display = 'flex'
    $('backToAdmin').style.display = 'inline-flex'
    $('subNav').style.display = 'flex'
  }
}

/* ── 文稿列表 ── */
async function loadArticles(){
  var res = await api('/api/articles?mine=1')
  if(!res || !res.ok){
    $('articleGrid').innerHTML = emptyStateHTML({icon:'warn', title:'加载失败', desc:'请刷新重试', ctaText:'重新加载', ctaOnclick:'loadArticles()'})
    return
  }
  var articles = res.data || []
  var filtered = articles
  if(currentFilter === 'pending'){
    filtered = articles.filter(function(a){return ['pending_l1','pending_l2','pending_l3'].includes(a.status)})
  } else if(currentFilter !== 'all'){
    filtered = articles.filter(function(a){return a.status === currentFilter})
  }

  // 更新草稿badge
  var draftCount = articles.filter(function(a){return a.status === 'draft'}).length
  if(draftCount > 0){
    $('draftBadge').textContent = draftCount
    $('draftBadge').style.display = 'inline-block'
  } else {
    $('draftBadge').style.display = 'none'
  }

  if(filtered.length === 0){
    $('articleGrid').innerHTML = emptyStateHTML({icon:'doc', title:'暂无文稿', desc:'写下第一篇，让校园听见你的声音', ctaText:'新建文稿', ctaOnclick:'showEditorView()'})
    return
  }

  var html = filtered.map(function(a){
    var st = STATUS_MAP[a.status] || STATUS_MAP['draft']
    var coverHtml = a.cover_image ? '<img class="article-cover" src="'+escurl(a.cover_image)+'" alt="" onerror="this.style.display=\'none\'">' : ''
    var summaryHtml = a.summary ? '<div class="article-summary">'+esc(a.summary)+'</div>' : ''
    var catText = CATEGORY_MAP[a.category] || '未分类'
    return '<div class="article-card" onclick="showDetailView('+a.id+')">'+
      coverHtml+
      '<div class="article-title">'+esc(a.title)+'</div>'+
      summaryHtml+
      '<div class="article-meta">'+
        '<span class="article-status '+st.cls+'">'+st.text+'</span>'+
        '<span>'+esc(catText)+'</span>'+
        '<span>'+formatDate(a.updated_at)+'</span>'+
      '</div>'+
      '<div class="article-actions">'+
        (['draft','rejected'].includes(a.status) ? '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();editArticle('+a.id+')">编辑</button>' : '')+
        (['draft','rejected'].includes(a.status) ? '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();submitExisting('+a.id+')">提交审核</button>' : '')+
        (!['published'].includes(a.status) ? '<button class="btn btn-outline btn-sm" style="color:#ef4444" onclick="event.stopPropagation();deleteArticle('+a.id+')">删除</button>' : '')+
      '</div>'+
    '</div>'
  }).join('')
  $('articleGrid').innerHTML = html
  applyStagger($('articleGrid'))
}

function setFilter(filter){
  currentFilter = filter
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active')})
  document.querySelector('.filter-chip[data-filter="'+filter+'"]').classList.add('active')
  loadArticles()
}

/* ── 视图切换 ── */
function showListView(){
  $('listView').classList.remove('hidden')
  $('editorView').classList.remove('active')
  $('detailView').classList.remove('active')
  $('pageTitle').textContent = '我的文稿'
  loadArticles()
}

function showEditorView(){
  $('listView').classList.add('hidden')
  $('editorView').classList.add('active')
  $('detailView').classList.remove('active')
  $('pageTitle').textContent = '新建文稿'
  editingArticleId = null
  $('editorMode').textContent = '新建文稿'
  $('articleTitle').value = ''
  $('articleCategory').value = 'news'
  $('articleReviewLevel').value = '1'
  $('articleCover').value = ''
  $('articleSummary').value = ''
  $('rteEditor').innerHTML = ''
  $('sensitiveResult').classList.remove('show','has-hits','clean')
  $('verBtn').style.display = 'none'
  $('autosaveStatus').textContent = ''
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')})
}

async function showDetailView(id){
  var res = await api('/api/articles/'+id)
  if(!res || !res.ok){
    toast(res && res.message || '加载失败')
    return
  }
  currentArticleDetail = res.data
  var a = res.data
  var st = STATUS_MAP[a.status] || STATUS_MAP['draft']

  $('listView').classList.add('hidden')
  $('editorView').classList.remove('active')
  $('detailView').classList.add('active')
  $('pageTitle').textContent = '文稿详情'

  $('detailTitle').textContent = a.title
  $('detailMeta').innerHTML = '<span class="article-status '+st.cls+'">'+st.text+'</span>'+
    '<span>'+esc(CATEGORY_MAP[a.category]||'未分类')+'</span>'+
    '<span>作者：'+esc(a.author_name||'未知')+'</span>'+
    '<span>'+formatDate(a.created_at)+'</span>'+
    (a.published_at ? '<span>发布于：'+formatDate(a.published_at)+'</span>' : '')

  $('detailContent').innerHTML = a.content || '<div style="color:var(--text-3);text-align:center;padding:40px">暂无内容</div>'

  // 审核记录
  var reviewRes = await api('/api/articles/'+id+'/reviews')
  if(reviewRes && reviewRes.ok && reviewRes.data && reviewRes.data.length > 0){
    var timelineHtml = reviewRes.data.map(function(r){
      var stage = STAGE_MAP[r.review_stage] || {text:r.review_stage, icon:'•', cls:'submit'}
      var actionIcon = r.action === 'approve' ? '✓' : r.action === 'reject' ? '✗' : r.action === 'return' ? '↩' : '<svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
      var actionCls = r.action === 'approve' ? 'approve' : r.action === 'reject' ? 'reject' : r.action === 'return' ? 'return' : 'submit'
      return '<div class="review-item">'+
        '<div class="review-dot '+actionCls+'">'+actionIcon+'</div>'+
        '<div class="review-content">'+
          '<div class="review-stage">'+esc(stage.text)+' — '+esc(r.reviewer_name||'系统')+'</div>'+
          '<div class="review-info">'+formatDate(r.created_at)+'</div>'+
          (r.comment ? '<div class="review-comment">'+esc(r.comment)+'</div>' : '')+
        '</div>'+
      '</div>'
    }).join('')
    $('reviewTimeline').innerHTML = timelineHtml
    $('detailReviewSection').style.display = 'block'
  } else {
    $('detailReviewSection').style.display = 'none'
  }

  // 发布日志
  if(a.status === 'published' || a.publish_targets !== '[]'){
    var pubRes = await api('/api/articles/'+id+'/publish-logs')
    // ── 定时发布区（仅审核通过/已定时的文稿显示） ──
    if(['approved','scheduled'].includes(a.status)){
      $('scheduleSection').style.display = 'block'
      var dtLocal = a.scheduled_at ? String(a.scheduled_at).slice(0,16).replace(' ','T') : ''

    } else {
      $('scheduleSection').style.display = 'none'
    }
    if(pubRes && pubRes.ok && pubRes.data && pubRes.data.length > 0){
      var pubHtml = pubRes.data.map(function(l){
        var platform = PLATFORM_MAP[l.platform] || l.platform
        var statusText = l.status === 'success' ? '<span style="color:#22c55e">成功</span>' : l.status === 'failed' ? '<span style="color:#ef4444">失败</span>' : '<span style="color:#f59e0b">待处理</span>'
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:8px;border:1px solid var(--border);margin-bottom:8px">'+
          '<div class="media-icon '+l.platform+'" style="width:36px;height:36px;font-size:16px">'+getPlatformIcon(l.platform)+'</div>'+
          '<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(platform)+'</div><div style="font-size:12px;color:var(--text-3)">'+formatDate(l.published_at)+'</div></div>'+
          '<div>'+statusText+'</div>'+
          (l.error_msg ? '<div style="font-size:12px;color:var(--text-3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+escurl(l.error_msg)+'">'+esc(l.error_msg)+'</div>' : '')+
        '</div>'
      }).join('')
      $('publishLogList').innerHTML = pubHtml
      $('detailPublishSection').style.display = 'block'
    } else {
      $('detailPublishSection').style.display = 'none'
    }
  } else {
    $('detailPublishSection').style.display = 'none'
  }

  // 操作按钮
  var actionsHtml = ''
  if(['draft','rejected'].includes(a.status) && a.author_id === currentUser.id){
    actionsHtml += '<button class="btn btn-outline btn-sm" onclick="editArticle('+a.id+')">编辑</button>'
    actionsHtml += '<button class="btn btn-primary btn-sm" onclick="submitExisting('+a.id+')">提交审核</button>'
  }
  if(currentUser.is_admin && a.status === 'published_ready'){
    actionsHtml += '<button class="btn btn-primary btn-sm" onclick="openPublishModal('+a.id+')">发布</button>'
  }
  if(currentUser.is_admin && ['pending_l1','pending_l2','pending_l3'].includes(a.status)){
    actionsHtml += '<button class="btn btn-primary btn-sm" onclick="openReviewModal('+a.id+')">审核</button>'
  }
  if(currentUser.is_admin && a.status === 'published'){
    actionsHtml += '<button class="btn btn-outline btn-sm" onclick="unpublishArticle('+a.id+')">下架</button>'
  }
  $('detailActions').innerHTML = actionsHtml

  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')})
}

/* ── 编辑器 ── */
async function editArticle(id){
  var res = await api('/api/articles/'+id)
  if(!res || !res.ok){
    toast(res && res.message || '加载失败')
    return
  }
  var a = res.data
  if(!['draft','rejected'].includes(a.status)){
    toast('当前状态不可编辑')
    return
  }
  editingArticleId = id
  $('listView').classList.add('hidden')
  $('editorView').classList.add('active')
  $('detailView').classList.remove('active')
  $('pageTitle').textContent = '编辑文稿'
  $('editorMode').textContent = '编辑：'+a.title
  $('articleTitle').value = a.title
  $('articleCategory').value = a.category || 'news'
  $('articleReviewLevel').value = String(a.review_level || 1)
  $('articleCover').value = a.cover_image || ''
  $('articleSummary').value = a.summary || ''
  $('rteEditor').innerHTML = a.content || ''
  $('sensitiveResult').classList.remove('show','has-hits','clean')
  $('verBtn').style.display = ''
  $('autosaveStatus').textContent = ''
}

function rteCmd(cmd, val){
  document.execCommand(cmd, false, val || null)
  $('rteEditor').focus()
}

var _autoSaveT = null, _dirty = false
function onEditorInput(){
  _dirty = true
  $('autosaveStatus').textContent = '编辑中…'
  if(_autoSaveT) clearTimeout(_autoSaveT)
  _autoSaveT = setTimeout(autoSave, 2500)
}
async function autoSave(){
  if(!_dirty || !editingArticleId) return
  var title = $('articleTitle').value.trim()
  if(!title){ $('autosaveStatus').textContent = ''; return }
  var res = await api('/api/articles/'+editingArticleId, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title: title, content: $('rteEditor').innerHTML, summary: $('articleSummary').value.trim(), category: $('articleCategory').value, cover_image: $('articleCover').value.trim(), silent: true })
  })
  if(res && res.ok){ _dirty = false; $('autosaveStatus').textContent = '✓ 已自动保存 ' + (res.savedAt || '') }
  else $('autosaveStatus').textContent = '自动保存失败，请手动保存'
}

/* ── 敏感词检测 ── */
async function checkSensitive(){
  var title = $('articleTitle').value
  var summary = $('articleSummary').value
  var content = $('rteEditor').innerText
  var fullText = title + ' ' + summary + ' ' + content

  if(!fullText.trim()){
    toast('请先输入内容')
    return
  }

  var res = await api('/api/articles/check-sensitive', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: fullText})
  })

  var el = $('sensitiveResult')
  if(!res || !res.ok){
    el.className = 'sensitive-result show has-hits'
    el.innerHTML = '<h4 style="color:#ef4444">检测失败</h4><div>'+(res&&res.message||'请稍后重试')+'</div>'
    return
  }

  var hits = (res.data && res.data.hits) ? res.data.hits : (Array.isArray(res.data) ? res.data : [])
  if(hits.length === 0){
    el.className = 'sensitive-result show clean'
    el.innerHTML = '<h4 style="color:#22c55e">✓ 未检测到敏感词</h4><div style="color:var(--text-2)">内容安全，可以提交审核</div>'
  } else {
    var highCount = hits.filter(function(h){return h.level==='high'}).length
    var medCount = hits.filter(function(h){return h.level==='medium'}).length
    var lowCount = hits.filter(function(h){return h.level==='low'}).length
    var hitsHtml = hits.map(function(h){
      return '<span class="sw-tag '+h.level+'">'+esc(h.word)+' ('+esc(h.level)+')</span>'
    }).join('')
    el.className = 'sensitive-result show has-hits'
    el.innerHTML = '<h4 style="color:#ef4444"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2.5px" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 4a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 检测到 '+hits.length+' 个敏感词</h4>'+
      '<div style="color:var(--text-2);font-size:12px">高级 '+highCount+' · 中级 '+medCount+' · 低级 '+lowCount+'</div>'+
      '<div class="sensitive-hits">'+hitsHtml+'</div>'+
      (highCount > 0 ? '<div style="margin-top:8px;color:#ef4444;font-size:12px">包含高级敏感词，无法提交审核，请修改后重试</div>' : '<div style="margin-top:8px;color:var(--text-3);font-size:12px">仅含中/低级敏感词，可提交但建议修改</div>')
  }
}

/* ── 辅助函数 ── */
function formatDate(s){
  if(!s) return ''
  var d = new Date(s.replace(' ','T'))
  if(isNaN(d)) return s
  var now = new Date()
  var diff = (now - d) / 1000
  if(diff < 60) return '刚刚'
  if(diff < 3600) return Math.floor(diff/60)+'分钟前'
  if(diff < 86400) return Math.floor(diff/3600)+'小时前'
  if(diff < 604800) return Math.floor(diff/86400)+'天前'
  return (d.getMonth()+1)+'月'+d.getDate()+'日'
}

  currentSubTab = tab
  document.querySelectorAll('.sub-nav-item').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-subtab') === tab)
  })
  $('listView').style.display = tab === 'articles' ? '' : 'none'
  $('reviewView').style.display = tab === 'review' ? '' : 'none'
  $('sensitiveView').style.display = tab === 'sensitive' ? 'none' : 'none'
  if(tab === 'sensitive') $('sensitiveView').style.display = ''
  if(tab === 'review') loadReviewArticles()
  if(tab === 'sensitive') loadSensitiveWords()
  var titles = {articles:'我的文稿', review:'文稿审核', sensitive:'敏感词库'}
  $('pageTitle').textContent = titles[tab] || '文稿工作台'
}

/* ── 文稿审核 ── */
function setReviewFilter(filter){
  currentReviewFilter = filter
  document.querySelectorAll('[data-review-filter]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-review-filter') === filter)
  })
  loadReviewArticles()
}

async function loadReviewArticles(){
  var res = await api('/api/articles?status=' + currentReviewFilter + '&limit=100')
  var grid = $('reviewGrid')
  if(!res || !res.ok){
    grid.innerHTML = emptyStateHTML({icon:'warn', title:'加载失败', desc:'请刷新重试', ctaText:'重新加载', ctaOnclick:'loadReviewArticles()'})
    return
  }
  var articles = res.data || []
  if(articles.length === 0){
    grid.innerHTML = emptyStateHTML({icon:'check', title:'暂无待审文稿', desc:'当前筛选条件下没有需要处理的内容'})
    return
  }
  grid.innerHTML = articles.map(renderReviewCard).join('')
  applyStagger(grid)
}

function renderReviewCard(a){
  var statusLabels = {
    pending_l1:'一审待审', pending_l2:'二审待审', pending_l3:'三审待审',
    published_ready:'待发布', rejected:'已拒绝'
  }
  var statusClass = a.status === 'rejected' ? 'rejected' :
    (a.status === 'published_ready' ? 'published_ready' : a.status)
  var actions = ''
  if(a.status && a.status.indexOf('pending_') === 0){
    actions = '<div style="display:flex;gap:6px;margin-top:8px">'+
      '<button class="btn btn-primary btn-sm" onclick="reviewArticle('+a.id+',\'approve\')">通过</button>'+
      '<button class="btn btn-outline btn-sm" onclick="reviewArticle('+a.id+',\'return\')">退回</button>'+
      '<button class="btn btn-outline btn-sm" style="color:#ef4444;border-color:rgba(239,68,68,.3)" onclick="reviewArticle('+a.id+',\'reject\')">拒绝</button>'+
      '<button class="btn btn-outline btn-sm" onclick="showReviewDetail('+a.id+')">查看</button>'+
    '</div>'
  } else {
    actions = '<div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-outline btn-sm" onclick="showReviewDetail('+a.id+')">查看详情</button></div>'
  }
  return '<div class="article-card" style="cursor:default">'+
    '<span class="article-status '+statusClass+'">'+escHtml(statusLabels[a.status]||a.status)+'</span>'+
    '<h3 class="article-card-title" style="margin-top:8px">'+escHtml(a.title)+'</h3>'+
    '<div class="article-card-meta">'+
      '<span>'+escHtml(a.author_name||'未知')+'</span>'+
      '<span>'+escHtml(a.category||'')+'</span>'+
      '<span>'+formatTime(a.created_at)+'</span>'+
    '</div>'+
    actions+
  '</div>'
}

async function showReviewDetail(id){
  showDetailView(id)
}

async function reviewArticle(id, action){
  var actionLabels = {approve:'通过', reject:'拒绝', return:'退回'}
  var comment = ''
  if(action !== 'approve'){
    comment = prompt('请输入'+actionLabels[action]+'原因（可选）：') || ''
  }
  var res = await api('/api/articles/'+id+'/review', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:action, comment:comment})
  })
  if(res && res.ok){
    toast(res.message || '操作成功')
    loadReviewArticles()
  } else {
    toast(res && res.message || '操作失败')
  }
}

/* ── 敏感词库 ── */
async function loadSensitiveWords(){
  var res = await api('/api/sensitive-words?limit=500')
  var grid = $('sensitiveGrid')
  if(!res || !res.ok){
    grid.innerHTML = emptyStateHTML({icon:'warn', title:'加载失败', desc:'请刷新重试', ctaText:'重新加载', ctaOnclick:'loadSensitiveWords()'})
    return
  }
  var words = res.data || []
  if(words.length === 0){
    grid.innerHTML = emptyStateHTML({sm:true, icon:'folder', title:'暂无敏感词', desc:'添加敏感词后，文稿发布前将自动检测'})
    return
  }
  grid.innerHTML = words.map(function(w){
    var levelColors = {high:'#ef4444', medium:'#f59e0b', low:'#6b7280'}
    var levelLabels = {high:'高', medium:'中', low:'低'}
    var color = levelColors[w.level] || '#6b7280'
    return '<div style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--card,rgba(255,255,255,.03));border:1px solid var(--border,rgba(255,255,255,.06));font-size:13px">'+
      '<span style="width:6px;height:6px;border-radius:50%;background:'+color+';flex-shrink:0"></span>'+
      '<span style="color:var(--text,#e8eaed)">'+escHtml(w.word)+'</span>'+
      '<span style="font-size:11px;color:'+color+'">'+levelLabels[w.level]+'</span>'+
      '<span style="font-size:11px;color:var(--text-3,#6b7280)">'+escHtml(w.category||'')+'</span>'+
      '<button onclick="deleteSensitiveWord('+w.id+')" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px;padding:0 2px;line-height:1">×</button>'+
    '</div>'
  }).join('')
}

async function addSensitiveWord(){
  var word = $('newSensitiveWord').value.trim()
  if(!word){ toast('请输入敏感词'); return }
  var level = $('newSensitiveLevel').value
  var category = $('newSensitiveCategory').value
  var res = await api('/api/admin/sensitive-words', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({word:word, level:level, category:category})
  })
  if(res && res.ok){
    toast('已添加')
    $('newSensitiveWord').value = ''
    loadSensitiveWords()
  } else {
    toast(res && res.message || '添加失败')
  }
}

async function deleteSensitiveWord(id){
  if(!confirm('确认删除此敏感词？')) return
  var res = await api('/api/admin/sensitive-words/'+id, {method:'DELETE'})
  if(res && res.ok){
    toast('已删除')
    loadSensitiveWords()
  } else {
    toast(res && res.message || '删除失败')
  }
}

function exportSensitiveWords(){
  window.open('/api/sensitive-words?limit=1000&format=csv', '_blank')
}

function escHtml(s){
  if(!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

init()
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw').catch(function (e) { console.warn('SW registration failed:', e) })
    })
  }
</script>
